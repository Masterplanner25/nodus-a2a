[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-a2a"
version = "0.1.0"
description = "Agent-to-Agent coordination: registry, delegation, dead letter, and watchdog"
authors = [{ name = "Shawn Knight" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Masterplanner25/nodus-a2a"
Repository = "https://github.com/Masterplanner25/nodus-a2a"

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus_a2a*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
