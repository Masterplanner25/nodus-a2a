[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-a2a"
version = "0.1.0"
description = "Agent-to-Agent coordination: registry, delegation, dead letter, and watchdog"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Masterplanner25" }]
dependencies = ["nodus-events>=0.1.0", "nodus-queue>=0.1.0", "nodus-state>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus_a2a*"]