[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodus-a2a"
version = "0.1.0"
description = "A2A 1.0.0 (LF) adapter for the Nodus scripting language"
authors = [{name = "Shawn Knight"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "nodus-lang>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/Masterplanner25/nodus-a2a"
Repository = "https://github.com/Masterplanner25/nodus-a2a"
Changelog = "https://github.com/Masterplanner25/nodus-a2a/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nodus_a2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/nodus_a2a"]
omit = ["src/nodus_a2a/__main__.py"]  # CLI entry-point; not exercised by unit tests

[tool.coverage.report]
fail_under = 80
show_missing = true
